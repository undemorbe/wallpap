name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS 26, arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app (ad-hoc signed)
        env:
          WALLPAP_SIGN_IDENTITY: "-"
          WALLPAP_VERSION: 0.0.0
          WALLPAP_BUILD: ${{ github.run_number }}
        run: ./build.sh --no-install

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/Wallpap.app
          test -x build/Wallpap.app/Contents/MacOS/Wallpap
          test -x build/Wallpap.app/Contents/Extensions/WallpapWallpaper.appex/Contents/MacOS/WallpapWallpaper
          plutil -lint build/Wallpap.app/Contents/Info.plist build/Wallpap.app/Contents/Extensions/WallpapWallpaper.appex/Contents/Info.plist

      - name: Package
        run: scripts/package.sh "0.0.0-ci.${{ github.run_number }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Wallpap-ci-${{ github.run_number }}
          path: dist/
          retention-days: 14
